<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Pixel Grid pattern in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none"/>
      <path d="M 30 0 L 0 0 0 30"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="280" height="36" rx="18" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5"/>
    <text x="140" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">
      ✨ FREE PATTERN MAKER
    </text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Pixel Craft Studio
    </text>

    <!-- Gradient Tagline -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#glow)">
      Turn Pictures into Beautiful Craft Charts
    </text>

    <!-- Subtitle description -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
      DMC Embroidery Floss • Perler Beads • Diamond Painting
    </text>
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
      AI Image Generator • Physical Sizing • Printable PDF Charts
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 270)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🧵 Cross-Stitch</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="205" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🔘 Perler Beads</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="350" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">💎 Diamond Paint</text>

      <!-- Tag 4 -->
      <rect x="430" y="0" width="110" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="485" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🔲 Pixel Art</text>
    </g>

    <!-- URL pill -->
    <g transform="translate(0, 345)">
      <text x="0" y="16" font-family="monospace" font-size="16" font-weight="600" fill="#818cf8">
        pixel-craft-studio-ten.vercel.app
      </text>
    </g>
  </g>

  <!-- Right Side: Graphic Card Illustration -->
  <g transform="translate(680, 80)">
    <!-- Glow behind card -->
    <rect x="-10" y="-10" width="460" height="460" rx="30" fill="#6366f1" opacity="0.15" filter="blur(20px)"/>

    <!-- Main Card Container -->
    <rect width="440" height="440" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>

    <!-- Mini Pixel Grid Simulation inside Card -->
    <g transform="translate(30, 30)">
      <!-- Grid Cells (Simulating a cute retro heart/flower) -->
      <!-- Row 0 -->
      <rect x="90" y="0" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="140" y="0" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="240" y="0" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="290" y="0" width="45" height="45" rx="6" fill="#f43f5e"/>

      <!-- Row 1 -->
      <rect x="40" y="50" width="45" height="45" rx="6" fill="#fb7185"/>
      <rect x="90" y="50" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="140" y="50" width="45" height="45" rx="6" fill="#fda4af"/>
      <rect x="190" y="50" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="240" y="50" width="45" height="45" rx="6" fill="#fda4af"/>
      <rect x="290" y="50" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="340" y="50" width="45" height="45" rx="6" fill="#fb7185"/>

      <!-- Row 2 -->
      <rect x="40" y="100" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="90" y="100" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="140" y="100" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="190" y="100" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="240" y="100" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="290" y="100" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="340" y="100" width="45" height="45" rx="6" fill="#be123c"/>

      <!-- Row 3 -->
      <rect x="90" y="150" width="45" height="45" rx="6" fill="#be123c"/>
      <rect x="140" y="150" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="190" y="150" width="45" height="45" rx="6" fill="#f43f5e"/>
      <rect x="240" y="150" width="45" height="45" rx="6" fill="#e11d48"/>
      <rect x="290" y="150" width="45" height="45" rx="6" fill="#be123c"/>

      <!-- Row 4 -->
      <rect x="140" y="200" width="45" height="45" rx="6" fill="#9f1239"/>
      <rect x="190" y="200" width="45" height="45" rx="6" fill="#be123c"/>
      <rect x="240" y="200" width="45" height="45" rx="6" fill="#9f1239"/>

      <!-- Row 5 -->
      <rect x="190" y="250" width="45" height="45" rx="6" fill="#881337"/>

      <!-- Symbols on beads -->
      <text x="112" y="27" font-family="monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="162" y="27" font-family="monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">●</text>
      <text x="262" y="27" font-family="monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="312" y="27" font-family="monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">●</text>
      <text x="212" y="177" font-family="monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">▲</text>
    </g>

    <!-- Color Palette Swatch bar in card footer -->
    <g transform="translate(30, 360)">
      <rect x="0" y="0" width="45" height="30" rx="6" fill="#881337"/>
      <rect x="55" y="0" width="45" height="30" rx="6" fill="#be123c"/>
      <rect x="110" y="0" width="45" height="30" rx="6" fill="#e11d48"/>
      <rect x="165" y="0" width="45" height="30" rx="6" fill="#f43f5e"/>
      <rect x="220" y="0" width="45" height="30" rx="6" fill="#fb7185"/>
      <rect x="275" y="0" width="45" height="30" rx="6" fill="#fda4af"/>
      <text x="350" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">DMC 666</text>
    </g>
  </g>
</svg>